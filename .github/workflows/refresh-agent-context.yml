name: Build and refresh agent context

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  context-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Refresh agent context
        run: python scripts/update_agent_context.py

      - name: Verify generated context is committed
        run: |
          git diff --exit-code -- \
            "AI agent Workspace/project-context.md" \
            "AI agent Workspace/project-context-state.json"
