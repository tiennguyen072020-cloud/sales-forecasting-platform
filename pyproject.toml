[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "sales_forecasting"
version = "0.1.0"
description = "Sales Forecasting and Business Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "joblib==1.5.3",
    "numpy==2.5.2",
    "openpyxl==3.1.5",
    "pandas==3.0.5",
    "prophet==1.4.0",
    "pydantic==2.13.4",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "uvicorn==0.52.4",
    "xgboost==3.4.1",
]

[project.optional-dependencies]
dev = [
    "build==1.3.0",
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "jupyter==1.1.1",
    "matplotlib==3.11.1",
    "pre-commit==4.5.0",
    "pytest==9.1.1",
    "seaborn==0.13.2",
]

[tool.setuptools]
package-dir = {"" = "."}


[tool.setuptools.packages.find]
where = ["."]
include = ["ml*", "api*"]
